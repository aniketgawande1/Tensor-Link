syntax = "proto3";

package chat;

service ChatService {
    rpc Chat(stream ChatMessage)
        returns (stream ChatMessage);
}

message ChatMessage {

    string username = 1;

    string room = 2;

    string message = 3;

    int64 timestamp = 4;

    MessageType type = 5;
}

enum MessageType {

    CHAT = 0;

    JOIN = 1;

    LEAVE = 2;

    SYSTEM = 3;
}